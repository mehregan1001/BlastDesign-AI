name: BlastDesign-AI automated tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Test Python package and research-report validator

    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run complete automated test suite
        run: python -m pytest -v

      - name: Validate saved research decision report
        run: |
          blastdesign-validate \
            data/processed/burden_decision_report_step_24_21.json