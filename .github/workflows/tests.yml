name: BlastDesign-AI automated tests

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} - Python ${{ matrix.python-version }} - installed wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        include:
          - os: windows-latest
            python-version: "3.11"
    steps:
      - name: Download repository
        uses: actions/checkout@v7
      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify the Git snapshot checksum manifest
        run: python scripts/generate_checksums.py --check

      - name: Build, install, and test the normal wheel and validator
        run: python scripts/check_wheel_installation.py
