[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "blastdesign-ai"
version = "0.1.0"
description = "Evidence-aware Python reconstruction and assessment of mine-blasting design models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"

authors = [
    { name = "Alireza Mehregan" },
]

keywords = [
    "mining-engineering",
    "drill-and-blast",
    "burden-design",
    "decision-support",
    "structural-uncertainty",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.scripts]
blastdesign-validate = "blastdesign_ai.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]